<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleMuse - Outfit Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843', 950: '#500724' },
            accent: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f', 950: '#451a03' }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes heart-pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }
    .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    .animate-heart-pop { animation: heart-pop 0.4s ease-out; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-shimmer { background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .drop-zone-active { border-color: #ec4899 !important; background-color: rgba(236, 72, 153, 0.1) !important; }
    .dragging { opacity: 0.5; transform: scale(0.95); }
    .mannequin-zone { transition: all 0.3s ease; }
    .mannequin-zone:hover { transform: scale(1.02); }
    .carousel-item { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen">
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-8">
          <a href="index.html" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
            </div>
            <span class="text-xl font-bold text-slate-900 dark:text-white">StyleMuse</span>
          </a>
          <nav class="hidden md:flex items-center gap-1">
            <a href="wardrobe.html" class="px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 rounded-lg transition-colors">Wardrobe</a>
            <a href="outfit-studio.html" class="px-3 py-2 text-sm font-medium text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-950/50 rounded-lg">Outfit Studio</a>
            <a href="saved-looks.html" class="px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 rounded-lg transition-colors">Saved Looks</a>
            <a href="style-insights.html" class="px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 rounded-lg transition-colors">Insights</a>
          </nav>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleDark()" class="p-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
          <div class="relative" id="user-menu">
            <button onclick="toggleUserMenu()" class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-400 to-accent-400 flex items-center justify-center text-white text-sm font-medium" id="user-avatar">U</div>
            </button>
            <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 py-1 animate-scale-in">
              <a href="index.html" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Dashboard</a>
              <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-slate-700">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div class="flex flex-col lg:flex-row gap-6">
      <!-- Left Panel: Wardrobe Items -->
      <aside class="w-full lg:w-72 shrink-0 animate-fade-in">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div class="p-4 border-b border-slate-200 dark:border-slate-800">
            <h2 class="font-semibold text-slate-900 dark:text-white">My Wardrobe</h2>
            <div class="flex flex-wrap gap-1.5 mt-3" id="category-tabs"></div>
          </div>
          <div class="p-3 max-h-[calc(100vh-280px)] overflow-y-auto" id="wardrobe-items">
            <div class="flex items-center justify-center py-8 text-slate-400"><div class="animate-spin w-6 h-6 border-2 border-primary-500 border-t-transparent rounded-full"></div></div>
          </div>
        </div>
      </aside>

      <!-- Center Panel: Mannequin -->
      <div class="flex-1 animate-fade-in stagger-1">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h2 class="font-semibold text-slate-900 dark:text-white">Virtual Try-On</h2>
            <div class="flex items-center gap-2">
              <button onclick="clearOutfit()" class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">Clear</button>
            </div>
          </div>
          <div class="relative aspect-[3/4] max-h-[600px] bg-gradient-to-b from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-900" id="mannequin-container">
            <div id="mannequin-setup" class="hidden absolute inset-0 flex flex-col items-center justify-center p-8 text-center">
              <div class="w-20 h-20 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center mb-4 animate-float">
                <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              </div>
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-2">Set Up Your Mannequin</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Upload a full-body photo to see how outfits look on you</p>
              <label class="px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium rounded-lg cursor-pointer transition-colors">
                Upload Photo
                <input type="file" accept="image/*" class="hidden" onchange="uploadMannequin(this)">
              </label>
            </div>
            <div id="mannequin-display" class="absolute inset-0 flex items-center justify-center">
              <div class="relative w-48 h-full" id="mannequin-body">
                <div class="mannequin-zone absolute top-[5%] left-1/2 -translate-x-1/2 w-32 h-24 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg flex items-center justify-center" data-zone="top" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'top')" ondragleave="handleDragLeave(event)">
                  <span class="text-xs text-slate-400">Top</span>
                </div>
                <div class="mannequin-zone absolute top-[35%] left-1/2 -translate-x-1/2 w-32 h-28 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg flex items-center justify-center" data-zone="bottom" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'bottom')" ondragleave="handleDragLeave(event)">
                  <span class="text-xs text-slate-400">Bottom</span>
                </div>
                <div class="mannequin-zone absolute bottom-[10%] left-1/2 -translate-x-1/2 w-28 h-16 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg flex items-center justify-center" data-zone="feet" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'feet')" ondragleave="handleDragLeave(event)">
                  <span class="text-xs text-slate-400">Shoes</span>
                </div>
                <div class="mannequin-zone absolute top-[15%] right-0 w-16 h-16 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg flex items-center justify-center" data-zone="accessories" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'accessories')" ondragleave="handleDragLeave(event)">
                  <span class="text-xs text-slate-400">Acc</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel: Outfit Controls -->
      <aside class="w-full lg:w-80 shrink-0 animate-fade-in stagger-2">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div class="p-4 border-b border-slate-200 dark:border-slate-800">
            <h2 class="font-semibold text-slate-900 dark:text-white">Style Filters</h2>
            <div class="mt-3">
              <label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">Occasion</label>
              <div class="flex flex-wrap gap-1.5 mt-2" id="occasion-filters"></div>
            </div>
            <div class="mt-3">
              <label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">Weather</label>
              <div class="flex flex-wrap gap-1.5 mt-2" id="weather-filters"></div>
            </div>
          </div>
          
          <div class="p-4 border-b border-slate-200 dark:border-slate-800">
            <button onclick="generateSuggestion()" id="ai-btn" class="w-full py-3 bg-gradient-to-r from-primary-500 to-accent-500 hover:from-primary-600 hover:to-accent-600 text-white font-medium rounded-xl transition-all hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              AI Suggest Outfit
            </button>
          </div>

          <div id="suggestions-carousel" class="hidden p-4 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Suggestions</span>
              <div class="flex gap-1">
                <button onclick="prevSuggestion()" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                <button onclick="nextSuggestion()" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
              </div>
            </div>
            <div class="overflow-hidden">
              <div id="carousel-track" class="flex transition-transform duration-500"></div>
            </div>
            <div class="flex justify-center gap-1 mt-3" id="carousel-dots"></div>
          </div>

          <div class="p-4">
            <div class="mb-4">
              <label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">Current Outfit</label>
              <div id="outfit-items" class="mt-2 space-y-2"></div>
            </div>
            <div class="flex gap-2">
              <button onclick="saveOutfit()" id="save-btn" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-xl transition-all flex items-center justify-center gap-2">
                <svg id="heart-icon" class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                Save Look
              </button>
              <button onclick="shareOutfit()" id="share-btn" class="py-2.5 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div id="share-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 max-w-md w-full mx-4 animate-scale-in">
      <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Share Your Look</h3>
      <input type="text" id="share-link" readonly class="w-full px-4 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-700 dark:text-slate-300">
      <div class="flex gap-2 mt-4">
        <button onclick="copyShareLink()" class="flex-1 py-2 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-lg transition-colors">Copy Link</button>
        <button onclick="closeShareModal()" class="py-2 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-lg transition-colors">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="auth-client.js"></script>
  <script>
    const categories = ['All', 'Tops', 'Bottoms', 'Outerwear', 'Shoes', 'Accessories'];
    const occasions = ['Work', 'Casual', 'Date Night', 'Workout', 'Formal'];
    const weathers = ['Sunny', 'Rainy', 'Cold', 'Hot'];
    let wardrobeItems = [];
    let currentOutfit = { top: null, bottom: null, feet: null, accessories: null };
    let selectedCategory = 'All';
    let selectedOccasion = null;
    let selectedWeather = null;
    let suggestions = [];
    let currentSuggestionIndex = 0;
    let hasMannequin = false;
    let draggedItem = null;

    async function init() {
      if (!window.AuthClient.isAuthenticated()) { window.location.href = 'login.html'; return; }
      const user = await window.AuthClient.getCurrentUser();
      if (user) document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
      await Promise.all([loadWardrobe(), loadMannequin()]);
      renderFilters();
    }

    async function loadWardrobe() {
      try {
        const res = await window.StyleMuse.apiGet('/apps/6d4b5e94-350a-49f5-aacc-20a9f910785a/api/wardrobe');
        if (res && res.success) { wardrobeItems = res.data.items || []; renderWardrobeItems(); }
      } catch (err) { console.error('Failed to load wardrobe:', err); renderWardrobeItems(); }
    }

    async function loadMannequin() {
      try {
        const res = await window.StyleMuse.apiGet('/apps/6d4b5e94-350a-49f5-aacc-20a9f910785a/api/mannequin');
        if (res && res.success && res.data.mannequin) {
          hasMannequin = true;
          const container = document.getElementById('mannequin-body');
          if (res.data.mannequin.image_data) {
            container.style.backgroundImage = `url(${res.data.mannequin.image_data})`;
            container.style.backgroundSize = 'contain';
            container.style.backgroundPosition = 'center';
            container.style.backgroundRepeat = 'no-repeat';
          }
        }
        updateMannequinDisplay();
      } catch (err) { updateMannequinDisplay(); }
    }

    function updateMannequinDisplay() {
      const setup = document.getElementById('mannequin-setup');
      const display = document.getElementById('mannequin-display');
      if (hasMannequin) { setup.classList.add('hidden'); display.classList.remove('hidden'); }
      else { setup.classList.remove('hidden'); display.classList.add('hidden'); }
    }

    function renderFilters() {
      const catContainer = document.getElementById('category-tabs');
      catContainer.innerHTML = categories.map(cat => `<button onclick="selectCategory('${cat}')" class="px-2.5 py-1 text-xs font-medium rounded-full transition-colors ${selectedCategory === cat ? 'bg-primary-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">${cat}</button>`).join('');
      const occContainer = document.getElementById('occasion-filters');
      occContainer.innerHTML = occasions.map(occ => `<button onclick="selectOccasion('${occ}')" class="px-2.5 py-1 text-xs font-medium rounded-full transition-colors ${selectedOccasion === occ ? 'bg-primary-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">${occ}</button>`).join('');
      const weatherContainer = document.getElementById('weather-filters');
      weatherContainer.innerHTML = weathers.map(w => `<button onclick="selectWeather('${w}')" class="px-2.5 py-1 text-xs font-medium rounded-full transition-colors ${selectedWeather === w ? 'bg-accent-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}">${w}</button>`).join('');
    }

    function selectCategory(cat) { selectedCategory = cat; renderFilters(); renderWardrobeItems(); }
    function selectOccasion(occ) { selectedOccasion = selectedOccasion === occ ? null : occ; renderFilters(); }
    function selectWeather(w) { selectedWeather = selectedWeather === w ? null : w; renderFilters(); }

    function renderWardrobeItems() {
      const container = document.getElementById('wardrobe-items');
      const filtered = selectedCategory === 'All' ? wardrobeItems : wardrobeItems.filter(i => i.category === selectedCategory);
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8"><svg class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg><p class="text-sm text-slate-500 dark:text-slate-400">No items found</p></div>`;
        return;
      }
      container.innerHTML = filtered.map(item => `
        <div class="group relative bg-slate-50 dark:bg-slate-800 rounded-xl overflow-hidden cursor-grab transition-all hover:shadow-md hover:scale-[1.02]" draggable="true" ondragstart="handleDragStart(event, ${item.id})" ondragend="handleDragEnd(event)">
          <div class="aspect-square bg-white dark:bg-slate-700">
            <img src="${item.image_data || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%239ca3af%22%3E%3Cpath d=%22M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z%22/%3E%3C/svg%3E'}" alt="${item.name}" class="w-full h-full object-cover">
          </div>
          <div class="p-2"><p class="text-xs font-medium text-slate-700 dark:text-slate-300 truncate">${item.name}</p><p class="text-xs text-slate-500">${item.category}</p></div>
        </div>
      `).join('');
    }

    function handleDragStart(e, itemId) { draggedItem = wardrobeItems.find(i => i.id === itemId); e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
    function handleDragEnd(e) { e.target.classList.remove('dragging'); draggedItem = null; }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drop-zone-active'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drop-zone-active'); }
    function handleDrop(e, zone) { e.preventDefault(); e.currentTarget.classList.remove('drop-zone-active'); if (draggedItem) addToZone(draggedItem, zone); }

    function addToZone(item, zone) {
      const zoneMap = { Tops: 'top', Bottoms: 'bottom', Outerwear: 'top', Shoes: 'feet', Accessories: 'accessories' };
      const targetZone = zoneMap[item.category] || zone;
      currentOutfit[targetZone] = item;
      updateMannequinZones();
      renderOutfitItems();
    }

    function updateMannequinZones() {
      Object.keys(currentOutfit).forEach(zone => {
        const zoneEl = document.querySelector(`[data-zone="${zone}"]`);
        if (!zoneEl) return;
        const item = currentOutfit[zone];
        if (item) {
          zoneEl.innerHTML = `<img src="${item.image_data}" alt="${item.name}" class="w-full h-full object-cover rounded-lg shadow-lg">`;
          zoneEl.classList.remove('border-dashed');
          zoneEl.classList.add('border-transparent');
        } else {
          const labels = { top: 'Top', bottom: 'Bottom', feet: 'Shoes', accessories: 'Acc' };
          zoneEl.innerHTML = `<span class="text-xs text-slate-400">${labels[zone]}</span>`;
          zoneEl.classList.add('border-dashed');
          zoneEl.classList.remove('border-transparent');
        }
      });
    }

    function renderOutfitItems() {
      const container = document.getElementById('outfit-items');
      const items = Object.entries(currentOutfit).filter(([_, item]) => item);
      if (items.length === 0) { container.innerHTML = '<p class="text-sm text-slate-400">Drag items to the mannequin</p>'; return; }
      container.innerHTML = items.map(([zone, item]) => `
        <div class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
          <img src="${item.image_data}" alt="${item.name}" class="w-10 h-10 object-cover rounded">
          <div class="flex-1 min-w-0"><p class="text-xs font-medium text-slate-700 dark:text-slate-300 truncate">${item.name}</p><p class="text-xs text-slate-500">${zone}</p></div>
          <button onclick="removeFromZone('${zone}')" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
      `).join('');
    }

    function removeFromZone(zone) { currentOutfit[zone] = null; updateMannequinZones(); renderOutfitItems(); }
    function clearOutfit() { currentOutfit = { top: null, bottom: null, feet: null, accessories: null }; updateMannequinZones(); renderOutfitItems(); }

    async function generateSuggestion() {
      const btn = document.getElementById('ai-btn');
      btn.innerHTML = '<div class="animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></div> Generating...';
      btn.disabled = true;
      try {
        const res = await window.StyleMuse.apiPost('/apps/6d4b5e94-350a-49f5-aacc-20a9f910785a/api/outfits/suggest', { occasion: selectedOccasion, weather: selectedWeather });
        if (res && res.success && res.data.suggestions) {
          suggestions = res.data.suggestions;
          currentSuggestionIndex = 0;
          renderSuggestions();
          document.getElementById('suggestions-carousel').classList.remove('hidden');
        } else { window.StyleMuse.showToast('No suggestions available', 'warning'); }
      } catch (err) { window.StyleMuse.showToast('Failed to generate suggestions', 'error'); }
      btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> AI Suggest Outfit';
      btn.disabled = false;
    }
