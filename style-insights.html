<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleMuse - Style Insights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843', 950: '#500724' },
            accent: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f', 950: '#451a03' }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes count-up { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .animate-scale-in { animation: scale-in 0.2s ease-out forwards; }
    .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
    .animate-count-up { animation: count-up 0.5s ease-out forwards; }
    .animate-shimmer { background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .stagger-1 { animation-delay: 0.05s; opacity: 0; }
    .stagger-2 { animation-delay: 0.1s; opacity: 0; }
    .stagger-3 { animation-delay: 0.15s; opacity: 0; }
    .stagger-4 { animation-delay: 0.2s; opacity: 0; }
    .stagger-5 { animation-delay: 0.25s; opacity: 0; }
    .stagger-6 { animation-delay: 0.3s; opacity: 0; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen">
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-8">
          <a href="index.html" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>

            <a href="outfit-studio.html" class="px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 rounded-lg transition-colors">Outfit Studio</a>
            <a href="saved-looks.html" class="px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 rounded-lg transition-colors">Saved Looks</a>
            <a href="style-insights.html" class="px-3 py-2 text-sm font-medium text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-950/50 rounded-lg">Insights</a>
          </nav>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleDark()" class="p-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">

            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 animate-fade-in">

        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Style Insights</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Understand your wardrobe patterns and style preferences</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportCSV()" class="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-sm font-medium rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          Export PDF
        </button>
      </div>
    </div>

    <!-- Overview Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 animate-fade-in stagger-1 hover:shadow-lg transition-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          </div>
          <span class="text-sm font-medium text-slate-500 dark:text-slate-400">Total Items</span>
        </div>
        <p class="text-3xl font-bold text-slate-900 dark:text-white animate-count-up" id="stat-total">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 animate-fade-in stagger-2 hover:shadow-lg transition-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-accent-100 dark:bg-accent-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-accent-600 dark:text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
          </div>
          <span class="text-sm font-medium text-slate-500 dark:text-slate-400">Top Category</span>
        </div>
        <p class="text-xl font-bold text-slate-900 dark:text-white truncate" id="stat-category">-</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 animate-fade-in stagger-3 hover:shadow-lg transition-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-rose-100 dark:bg-rose-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          </div>
          <span class="text-sm font-medium text-slate-500 dark:text-slate-400">Saved Looks</span>
        </div>
        <p class="text-3xl font-bold text-slate-900 dark:text-white animate-count-up" id="stat-saved">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 animate-fade-in stagger-4 hover:shadow-lg transition-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          </div>
          <span class="text-sm font-medium text-slate-500 dark:text-slate-400">Diversity Score</span>
        </div>
        <p class="text-3xl font-bold text-slate-900 dark:text-white animate-count-up" id="stat-diversity">0<span class="text-lg">%</span></p>
      </div>

    <!-- Charts Row -->
    <div class="grid lg:grid-cols-2 gap-6 mb-8">
      <!-- Category Distribution -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 animate-fade-in stagger-5">

        <div class="flex items-center justify-center">

        <div id="categoryLegend" class="grid grid-cols-2 gap-2 mt-4"></div>

      <!-- Color Palette -->

        <div id="colorPalette" class="flex flex-wrap gap-3 justify-center mb-4"></div>
        <div id="colorList" class="space-y-2"></div>
      </div>
    </div>

    <!-- Most Used Items -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 mb-8 animate-fade-in">
      <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Most Worn Items</h2>
      <div id="mostUsedItems" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
    </div>

    <!-- Style Streak & Suggestions -->
    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Style Streak -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 animate-fade-in">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Style Activity</h2>
        <div id="styleStreak" class="space-y-3"></div>
      </div>

      <!-- Suggestions -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 animate-fade-in">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">Wardrobe Suggestions</h2>
        <div id="suggestions" class="space-y-3"></div>
      </div>
    </div>

  <script src="app.js"></script>
  <script>
    let analyticsData = null;

    async function init() {
      if (!window.StyleMuse?.isAuthenticated?.()) {
        window.location.href = 'login.html';
        return;
      }
      await loadAnalytics();
    }

    async function loadAnalytics() {
      try {
        const res = await fetch('/apps/6d4b5e94-350a-49f5-aacc-20a9f910785a/api/analytics', {
          headers: window.StyleMuse.getAuthHeaders()
        });
        if (!res.ok) throw new Error('Failed to load analytics');
        const data = await res.json();
        if (data.success) {
          analyticsData = data.data;
          renderAnalytics();
        }
      } catch (err) {
        console.error('Error loading analytics:', err);
        window.StyleMuse?.showToast?.('Failed to load analytics', 'error');
      }
    }

    function renderAnalytics() {
      const d = analyticsData;
      document.getElementById('stat-total').textContent = d.totalItems || 0;
      document.getElementById('stat-category').textContent = d.topCategory || 'None';
      document.getElementById('stat-saved').textContent = d.totalSavedLooks || 0;
      document.getElementById('stat-diversity').innerHTML = `${d.diversityScore || 0}<span class="text-lg">%</span>`;
      renderCategoryChart(d.categoryDistribution || {});
      renderColorPalette(d.colorPalette || []);
      renderMostUsedItems(d.mostUsedItems || []);
      renderStyleStreak(d.styleStreak || []);
      renderSuggestions(d.suggestions || []);
    }

    function renderCategoryChart(categories) {
      const canvas = document.getElementById('categoryChart');
      const ctx = canvas.getContext('2d');
      const colors = ['#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ef4444'];
      const entries = Object.entries(categories);
      if (entries.length === 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No data yet', canvas.width / 2, canvas.height / 2);
        return;
      }
      const total = entries.reduce((sum, [, count]) => sum + count, 0);
      let startAngle = -Math.PI / 2;
      entries.forEach(([cat, count], i) => {
        const sliceAngle = (count / total) * 2 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height / 2);
        ctx.arc(canvas.width / 2, canvas.height / 2, 120, startAngle, startAngle + sliceAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += sliceAngle;
      });
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, 2 * Math.PI);
      ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#1e293b' : '#ffffff';
      ctx.fill();
      const legend = document.getElementById('categoryLegend');
      legend.innerHTML = entries.map(([cat, count], i) => `
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full" style="background: ${colors[i % colors.length]}"></div>
          <span class="text-sm text-slate-600 dark:text-slate-400">${cat} (${count})</span>
        </div>
      `).join('');
    }

    function renderColorPalette(colors) {
      const palette = document.getElementById('colorPalette');
      const list = document.getElementById('colorList');
      if (!colors.length) {
        palette.innerHTML = '<p class="text-slate-400 text-sm">Add items to see your color palette</p>';
        return;
      }
      palette.innerHTML = colors.slice(0, 8).map(c => `
        <div class="w-12 h-12 rounded-xl shadow-md hover:scale-110 transition-transform cursor-pointer" style="background: ${c.color}" title="${c.name}"></div>
      `).join('');
      list.innerHTML = colors.slice(0, 5).map(c => `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded" style="background: ${c.color}"></div>
            <span class="text-sm text-slate-700 dark:text-slate-300">${c.name}</span>
          </div>
          <span class="text-sm text-slate-500">${c.count} items</span>
        </div>
      `).join('');
    }

    function renderMostUsedItems(items) {
      const container = document.getElementById('mostUsedItems');
      if (!items.length) {
        container.innerHTML = `
          <div class="col-span-full text-center py-8">
            <svg class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <p class="text-slate-500 dark:text-slate-400 text-sm">Save outfits to track your most worn items</p>
          </div>
        `;
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="group relative aspect-square rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-700">
          <img src="${item.image_data || ''}" alt="${item.name}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2">
            <p class="text-white text-xs font-medium truncate">${item.name}</p>
          </div>
          <div class="absolute top-2 right-2 bg-white dark:bg-slate-800 rounded-full px-2 py-0.5 text-xs font-medium text-slate-700 dark:text-slate-300">${item.usageCount}x</div>
        </div>
      `).join('');
    }

    function renderStyleStreak(streak) {
      const container = document.getElementById('styleStreak');
      if (!streak.length) {
        container.innerHTML = `
          <div class="text-center py-6">
            <svg class="w-10 h-10 mx-auto text-slate-300 dark:text-slate-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <p class="text-slate-500 text-sm">Start saving outfits to see your activity</p>
          </div>
        `;
        return;
      }
      container.innerHTML = streak.map(s => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center text-primary-600 dark:text-primary-400 text-sm font-bold">${s.count}</div>
            <span class="text-sm text-slate-700 dark:text-slate-300">${s.label}</span>
          </div>
          <span class="text-xs text-slate-500">${s.period}</span>
        </div>
      `).join('');
    }

    function renderSuggestions(suggestions) {
      const container = document.getElementById('suggestions');
      if (!suggestions.length) {
        container.innerHTML = `
          <div class="text-center py-6">
            <svg class="w-10 h-10 mx-auto text-emerald-300 dark:text-emerald-700 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-slate-500 text-sm">Your wardrobe is well balanced!</p>
          </div>
        `;
        return;
      }
      container.innerHTML = suggestions.map(s => `
        <div class="flex items-start gap-3 p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/30">
          <svg class="w-5 h-5 text-amber-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
          <div>
            <p class="text-sm font-medium text-amber-800 dark:text-amber-200">${s.title}</p>
            <p class="text-xs text-amber-600 dark:text-amber-400 mt-1">${s.description}</p>
          </div>
        </div>
      `).join('');
    }

    async function exportCSV() {
      try {
        const res = await fetch('/apps/6d4b5e94-350a-49f5-aacc-20a9f910785a/api/wardrobe', { headers: window.StyleMuse.getAuthHeaders() });
        if (!res.ok) throw new Error('Failed to fetch wardrobe');
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        const items = data.data.items || [];
        const csv = ['Name,Category,Color,Created'];
        items.forEach(item => {
          csv.push(`"${item.name}","${item.category}","${item.color || ''}","${item.created_at || ''}"`);
        });
        const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'wardrobe-export.csv';
        a.click();
        URL.revokeObjectURL(url);
        window.StyleMuse?.showToast?.('Wardrobe exported as CSV', 'success');
      } catch (err) {
        window.StyleMuse?.showToast?.('Failed to export CSV', 'error');
      }
    }

    function exportPDF() {
      const printContent = `
        <html>
        <head><title>StyleMuse Wardrobe Report</title>
        <style>body{font-family:system-ui;padding:40px;} h1{color:#ec4899;}</style>
        </head>
        <body>
          <h1>StyleMuse Wardrobe Report</h1>
          <p>Generated on ${new Date().toLocaleDateString()}</p>
          <h2>Overview</h2>
          <p>Total Items: ${analyticsData?.totalItems || 0}</p>
          <p>Saved Looks: ${analyticsData?.totalSavedLooks || 0}</p>
          <p>Diversity Score: ${analyticsData?.diversityScore || 0}%</p>
        </body>
        </html>
      `;
      const printWindow = window.open('', '_blank');
      printWindow.document.write(printContent);
      printWindow.document.close();
      printWindow.print();
      window.StyleMuse?.showToast?.('PDF export ready', 'success');
    }

    function toggleDark() {
      window.StyleMuse?.toggleDark?.();
    }

    function logout() {
      window.StyleMuse?.logout?.();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
